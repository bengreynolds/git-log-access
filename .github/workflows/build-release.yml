name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            name: windows-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
            name: linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
            name: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
            name: macos-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Create distribution package
      shell: bash
      run: |
        mkdir -p dist
        
        # Copy main executable
        cp target/${{ matrix.target }}/release/git-monitor${{ matrix.ext }} dist/
        
        # Copy configuration files
        cp config/default.json dist/git-monitor.json
        cp README.md dist/
        cp LICENSE dist/ 2>/dev/null || echo "MIT License - see repository" > dist/LICENSE
        
        # Create install scripts for each platform
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          cp scripts/install-binary.ps1 dist/install.ps1
          cp scripts/install-binary.bat dist/install.bat
        else
          cp scripts/install-binary.sh dist/install.sh
          chmod +x dist/install.sh
        fi
        
        # Create archive
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          cd dist && 7z a ../git-monitor-${{ matrix.name }}.zip . && cd ..
        else
          tar -czf git-monitor-${{ matrix.name }}.tar.gz -C dist .
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: git-monitor-${{ matrix.name }}
        path: |
          git-monitor-${{ matrix.name }}.*
        retention-days: 7

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --verbose

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check formatting
      run: cargo fmt -- --check

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -name "git-monitor-*" -type f | while read file; do
          cp "$file" release-assets/
        done
        ls -la release-assets/

    - name: Extract release notes
      id: extract_notes
      run: |
        if [ -f CHANGELOG.md ]; then
          # Extract notes for current version from CHANGELOG.md
          awk '/^## /{if(found) exit; if(/'"${GITHUB_REF#refs/tags/}"'/) found=1; next} found' CHANGELOG.md > release_notes.txt
        else
          echo "Release ${GITHUB_REF#refs/tags/}" > release_notes.txt
          echo "" >> release_notes.txt
          echo "Binary distributions for multiple platforms." >> release_notes.txt
          echo "" >> release_notes.txt
          echo "## Installation" >> release_notes.txt
          echo "1. Download the appropriate archive for your platform" >> release_notes.txt
          echo "2. Extract and run the install script" >> release_notes.txt
          echo "3. Follow the setup instructions" >> release_notes.txt
        fi
        
        # Ensure release notes exist and aren't empty
        if [ ! -s release_notes.txt ]; then
          echo "Release ${GITHUB_REF#refs/tags/}" > release_notes.txt
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        body_path: release_notes.txt
        draft: false
        prerelease: ${{ contains(github.ref, '-') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit