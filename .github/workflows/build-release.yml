name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            name: windows-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
            name: linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
            name: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
            name: macos-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Create distribution package
      shell: bash
      run: |
        mkdir -p release-dist
        
        # Copy main executable
        cp target/${{ matrix.target }}/release/git-monitor${{ matrix.ext }} release-dist/
        
        # Copy configuration and documentation
        cp config/default.json release-dist/git-monitor.json
        cp README.md release-dist/
        cp QUICKSTART.md release-dist/ 2>/dev/null || echo "# Quick Start - See README.md" > release-dist/QUICKSTART.md
        echo "MIT License - see repository for details" > release-dist/LICENSE
        
        # Create platform-specific install scripts
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          cp scripts/install-binary.ps1 release-dist/install.ps1
          cp scripts/install-binary.bat release-dist/install.bat
          echo "# Git Monitor v${{ github.ref_name || '1.0.0' }} - Windows x64" > release-dist/INSTALL.md
          echo "Run: install.ps1 or install.bat" >> release-dist/INSTALL.md
        else
          cp scripts/install-binary.sh release-dist/install.sh
          chmod +x release-dist/install.sh
          echo "# Git Monitor v${{ github.ref_name || '1.0.0' }} - ${{ matrix.name }}" > release-dist/INSTALL.md
          echo "Run: ./install.sh" >> release-dist/INSTALL.md
        fi
        
        # Create detailed README for this platform
        echo "# Git Monitor - ${{ matrix.name }}" > release-dist/README-PLATFORM.md
        echo "" >> release-dist/README-PLATFORM.md
        echo "This package contains the pre-compiled Git Monitor executable for ${{ matrix.name }}." >> release-dist/README-PLATFORM.md
        echo "" >> release-dist/README-PLATFORM.md
        echo "## Quick Install" >> release-dist/README-PLATFORM.md
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          echo "1. Extract this ZIP file" >> release-dist/README-PLATFORM.md
          echo "2. Run install.ps1 (PowerShell) or install.bat" >> release-dist/README-PLATFORM.md
          echo "3. Follow the instructions" >> release-dist/README-PLATFORM.md
        else
          echo "1. Extract this archive" >> release-dist/README-PLATFORM.md
          echo "2. Run: chmod +x install.sh && ./install.sh" >> release-dist/README-PLATFORM.md
          echo "3. Follow the instructions" >> release-dist/README-PLATFORM.md
        fi
        echo "" >> release-dist/README-PLATFORM.md
        echo "## Files Included" >> release-dist/README-PLATFORM.md
        echo "- git-monitor${{ matrix.ext }} - Main executable" >> release-dist/README-PLATFORM.md
        echo "- git-monitor.json - Default configuration" >> release-dist/README-PLATFORM.md
        echo "- install.* - Installation scripts" >> release-dist/README-PLATFORM.md
        echo "- README.md - Full documentation" >> release-dist/README-PLATFORM.md
        
        # Create appropriately named archive
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          cd release-dist
          powershell -Command "Compress-Archive -Path * -DestinationPath ../git-monitor-${{ github.ref_name || 'v1.0.0' }}-${{ matrix.name }}.zip"
          cd ..
        else
          tar -czf git-monitor-${{ github.ref_name || 'v1.0.0' }}-${{ matrix.name }}.tar.gz -C release-dist .
        fi
        
        # Also create a standalone executable for direct download
        mkdir -p standalone
        cp target/${{ matrix.target }}/release/git-monitor${{ matrix.ext }} standalone/git-monitor-${{ github.ref_name || 'v1.0.0' }}-${{ matrix.name }}${{ matrix.ext }}

    - name: Upload package artifacts
      uses: actions/upload-artifact@v7
      with:
        name: git-monitor-${{ matrix.name }}
        path: standalone/
        retention-days: 7

    - name: Upload archive artifacts
      uses: actions/upload-artifact@v7
      with:
        name: git-monitor-archive-${{ matrix.name }}
        path: |
          git-monitor-*.zip
          git-monitor-*.tar.gz
        retention-days: 7

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --verbose

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check formatting
      run: cargo fmt -- --check

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        
        # Copy all archives (full packages with installers)
        find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) | while read file; do
          cp "$file" release-assets/
        done
        
        # Copy standalone executables regardless of artifact folder layout
        find artifacts -type f -name "git-monitor-*" | while read file; do
          case "$file" in
            *.zip|*.tar.gz)
              ;;
            *)
              cp "$file" release-assets/
              ;;
          esac
        done

        # Copy generated download manifest from package artifacts when present
        find artifacts -type f -name "DOWNLOADS.md" | while read file; do
          cp "$file" release-assets/
        done
        
        # Create a summary of available downloads
        echo "# Available Downloads" > release-assets/DOWNLOADS.md
        echo "" >> release-assets/DOWNLOADS.md
        echo "## Full Packages (Recommended)" >> release-assets/DOWNLOADS.md
        echo "These include the executable, installer scripts, configuration, and documentation:" >> release-assets/DOWNLOADS.md
        echo "" >> release-assets/DOWNLOADS.md
        ls release-assets/*.zip release-assets/*.tar.gz 2>/dev/null | while read file; do
          filename=$(basename "$file")
          case "$filename" in
            *windows*)
              echo "- **$filename** - Windows installer package" >> release-assets/DOWNLOADS.md
              ;;
            *linux*)
              echo "- **$filename** - Linux installer package" >> release-assets/DOWNLOADS.md
              ;;
            *macos*)
              echo "- **$filename** - macOS installer package" >> release-assets/DOWNLOADS.md
              ;;
          esac
        done
        echo "" >> release-assets/DOWNLOADS.md
        echo "## Standalone Executables" >> release-assets/DOWNLOADS.md
        echo "Just the executable file (manual setup required):" >> release-assets/DOWNLOADS.md
        echo "" >> release-assets/DOWNLOADS.md
        ls release-assets/git-monitor-*-* 2>/dev/null | grep -v ".zip\|.tar.gz" | while read file; do
          filename=$(basename "$file")
          echo "- **$filename** - Standalone executable" >> release-assets/DOWNLOADS.md
        done
        
        echo "Release assets prepared:"
        ls -la release-assets/

    - name: Extract release notes
      id: extract_notes
      run: |
        if [ -f CHANGELOG.md ]; then
          # Extract notes for current version from CHANGELOG.md
          awk '/^## /{if(found) exit; if(/'"${GITHUB_REF#refs/tags/}"'/) found=1; next} found' CHANGELOG.md > release_notes.txt
        else
          echo "# Git Monitor ${GITHUB_REF#refs/tags/}" > release_notes.txt
          echo "" >> release_notes.txt
          echo "Cross-platform git command monitoring with shell hooks and a background process monitor." >> release_notes.txt
          echo "" >> release_notes.txt
          echo "## 📦 Downloads" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "### Recommended: Full Installation Packages" >> release_notes.txt
          echo "These include everything you need - executable, installers, configuration, and documentation:" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "- **Windows**: Download \`git-monitor-*-windows-x64.zip\`" >> release_notes.txt
          echo "- **Linux**: Download \`git-monitor-*-linux-x64.tar.gz\`" >> release_notes.txt
          echo "- **macOS (Intel)**: Download \`git-monitor-*-macos-x64.tar.gz\`" >> release_notes.txt
          echo "- **macOS (Apple Silicon)**: Download \`git-monitor-*-macos-arm64.tar.gz\`" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "### Quick Installation" >> release_notes.txt
          echo "1. Download the appropriate package for your platform" >> release_notes.txt
          echo "2. Extract the archive" >> release_notes.txt
          echo "3. Run the installer:" >> release_notes.txt
          echo "   - Windows: \`install.ps1\` (PowerShell) or \`install.bat\`" >> release_notes.txt
          echo "   - Linux/macOS: \`./install.sh\`" >> release_notes.txt
          echo "4. Follow the setup instructions" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "### Alternative: Standalone Executables" >> release_notes.txt
          echo "If you prefer manual installation, standalone executables are also available." >> release_notes.txt
          echo "" >> release_notes.txt
          echo "## ✨ Features" >> release_notes.txt
          echo "- Cross-platform git command monitoring (Windows/Linux/macOS)" >> release_notes.txt  
          echo "- Hook-based interception for supported shells" >> release_notes.txt
          echo "- Background process monitor for additional coverage" >> release_notes.txt
          echo "- Performance optimized: <10MB RAM, <0.1% CPU usage" >> release_notes.txt
          echo "- Command sanitization for security" >> release_notes.txt
          echo "- Log rotation and configuration management" >> release_notes.txt
          echo "- Simple installation with no dependencies" >> release_notes.txt
        fi
        
        # Ensure release notes exist and aren't empty
        if [ ! -s release_notes.txt ]; then
          echo "Release ${GITHUB_REF#refs/tags/}" > release_notes.txt
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        body_path: release_notes.txt
        draft: false
        prerelease: ${{ contains(github.ref, '-') }}
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit
