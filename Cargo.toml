[package]
name = "git-log-access"
version = "0.1.0"
edition = "2021"
description = "Cross-platform git command monitoring service"
license = "MIT"
authors = ["Your Name <your.email@domain.com>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.0", features = ["derive"] }
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.6"
winapi = { version = "0.3", features = ["minwindef", "winbase", "winerror"] }

[target.'cfg(unix)'.dependencies]
nix = "0.29"
libc = "0.2"

[lib]
name = "git_log_access"
path = "src/lib.rs"

[[bin]]
name = "git-monitor"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true